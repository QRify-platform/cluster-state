name: Sync ArgoCD Root App

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  sync-argocd-root-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure kubectl for EKS
        uses: QRify-platform/github-actions/eks-kubeconfig@main
        with:
          aws-role-to-assume: ${{ secrets.AWS_EKS_ROLE_TO_ASSUME }}
          aws-region: us-east-2
          cluster-name: qrify-eks

      - name: Wait for Argo CD
        run: kubectl rollout status deployment/argocd-server -n argocd --timeout=120s

      - name: Apply root application
        run: |
          set -euo pipefail
          kubectl apply -f root-app.yaml
          kubectl -n argocd annotate application qrify-root-app \
            argocd.argoproj.io/refresh=hard --overwrite

      # App-of-apps root can stay OutOfSync due to Application CR drift.
      # Wait on the qrify leaf apps instead.
      - name: Wait for qrify apps
        run: |
          set -euo pipefail
          APPS="qrify-web-dev qrify-web-prod qrify-web-api-dev qrify-web-api-prod"

          for i in $(seq 1 60); do
            echo "attempt=$i"
            ready=true

            for app in $APPS; do
              sync=$(kubectl -n argocd get application "$app" \
                -o jsonpath='{.status.sync.status}' 2>/dev/null || echo Missing)
              health=$(kubectl -n argocd get application "$app" \
                -o jsonpath='{.status.health.status}' 2>/dev/null || echo Missing)
              echo "  $app sync=$sync health=$health"

              if [ "$sync" != "Synced" ] || [ "$health" != "Healthy" ]; then
                ready=false
              fi
            done

            if [ "$ready" = true ]; then
              echo "All qrify apps are Synced and Healthy"
              exit 0
            fi

            sleep 5
          done

          echo "Timed out waiting for qrify apps"
          kubectl -n argocd get applications
          kubectl get pods -A | grep -E 'qrify|ImagePull|Error|Crash|Pending' || true
          exit 1
