name: Sync ArgoCD Root App

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  sync-argocd-root-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure AWS credentials from OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_EKS_ROLE_TO_ASSUME }}
          aws-region: us-east-2

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region us-east-2 --name qrify-eks

      - name: Wait for Argo CD
        run: |
          kubectl rollout status deployment/argocd-server -n argocd --timeout=120s

      - name: Apply root application
        run: |
          kubectl apply -f root-app.yaml
          kubectl -n argocd annotate application qrify-root-app \
            argocd.argoproj.io/refresh=hard --overwrite

      - name: Wait for leaf apps
        run: |
          # Root app-of-apps can stay OutOfSync due to Application CR drift.
          # Wait on leaf apps instead.
          for i in $(seq 1 60); do
            echo "=== attempt=$i ==="
            kubectl -n argocd get applications \
              -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status \
              --no-headers

            BAD=$(kubectl -n argocd get applications -o json | python3 -c '
import json, sys
data = json.load(sys.stdin)
bad = []
for app in data.get("items", []):
    name = app["metadata"]["name"]
    if name == "qrify-root-app":
        continue
    sync = app.get("status", {}).get("sync", {}).get("status", "")
    health = app.get("status", {}).get("health", {}).get("status", "")
    if sync in ("", "Unknown") or health in ("", "Progressing", "Unknown"):
        bad.append(f"{name}:sync={sync}:health={health}")
    elif name.startswith("qrify-") and health == "Degraded":
        bad.append(f"{name}:sync={sync}:health={health}")
    elif sync == "OutOfSync" and health != "Healthy":
        bad.append(f"{name}:sync={sync}:health={health}")
print("\n".join(bad))
')
            if [ -z "$BAD" ]; then
              echo "All leaf apps look good"
              exit 0
            fi
            echo "still waiting:"
            echo "$BAD"
            sleep 5
          done
          echo "Timed out waiting for leaf apps"
          kubectl -n argocd get applications
          kubectl get pods -A | grep -vE "Running|Completed" || true
          exit 1
