name: Sync ArgoCD Root App

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  sync-argocd-root-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure AWS credentials from OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_EKS_ROLE_TO_ASSUME }}
          aws-region: us-east-2

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region us-east-2 --name qrify-eks

      - name: Wait for Argo CD
        run: |
          kubectl rollout status deployment/argocd-server -n argocd --timeout=120s

      - name: Apply root application
        run: |
          kubectl apply -f root-app.yaml
          # Force Argo to refresh from Git immediately (auto-sync is enabled).
          kubectl -n argocd annotate application qrify-root-app \
            argocd.argoproj.io/refresh=hard --overwrite

      - name: Wait until Synced and Healthy
        run: |
          for i in $(seq 1 36); do
            SYNC=$(kubectl -n argocd get application qrify-root-app \
              -o jsonpath='{.status.sync.status}' 2>/dev/null || true)
            HEALTH=$(kubectl -n argocd get application qrify-root-app \
              -o jsonpath='{.status.health.status}' 2>/dev/null || true)
            echo "attempt=$i sync=$SYNC health=$HEALTH"
            if [ "$SYNC" = "Synced" ] && [ "$HEALTH" = "Healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for qrify-root-app to become Synced/Healthy"
          kubectl -n argocd get application qrify-root-app -o yaml
          exit 1
