apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qrify-root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/QRify-platform/cluster-state
    targetRevision: HEAD
    path: app-of-apps
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # App-of-apps parents often look OutOfSync due to live Application CR drift.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jqPathExpressions:
        - .metadata.annotations."kubectl.kubernetes.io/last-applied-configuration"
        - .status
        - .operation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
