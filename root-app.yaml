apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qrify-root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/QRify-platform/cluster-state
    targetRevision: HEAD
    path: app-of-apps
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Parent compares child Application CRs to Git. Live objects drift
  # (annotations, dependencyUpdate, status) so ignore those fields.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jqPathExpressions:
        - .metadata.annotations
        - .metadata.labels
        - .status
        - .operation
        - .spec.source.helm.dependencyUpdate
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
