apps:
  - name: argo-rollouts
    env: platform
    namespace: argo-rollouts
    path: apps-infra/argo-rollouts
    syncWave: "-3"
    valuesFiles:
      - values.yaml

  - name: external-secrets
    env: platform
    namespace: external-secrets
    path: apps-infra/external-secrets
    syncWave: "-3"
    valuesFiles:
      - values.yaml

  - name: external-dns
    env: platform
    namespace: external-dns
    path: apps-infra/external-dns
    syncWave: "-3"
    valuesFiles:
      - values.yaml

  - name: prometheus-grafana
    env: platform
    namespace: monitoring
    path: apps-infra/prometheus-grafana
    syncWave: "-2"
    valuesFiles:
      - values.yaml

  - name: loki-stack
    env: platform
    namespace: logging
    path: apps-infra/loki-stack
    syncWave: "-2"
    valuesFiles:
      - values.yaml

  - name: qrify-web
    env: dev
    namespace: dev
    valuesFiles:
      - values.yaml
      - values.dev.yaml

  - name: qrify-web
    env: prod
    namespace: prod
    valuesFiles:
      - values.yaml
      - values.prod.yaml

  - name: qrify-web-api
    env: dev
    namespace: dev
    valuesFiles:
      - values.yaml
      - values.dev.yaml

  - name: qrify-web-api
    env: prod
    namespace: prod
    valuesFiles:
      - values.yaml
      - values.prod.yaml

  - name: qrify-portal
    env: dev
    namespace: dev
    valuesFiles:
      - values.yaml
      - values.dev.yaml

  - name: qrify-portal
    env: prod
    namespace: prod
    valuesFiles:
      - values.yaml
      - values.prod.yaml
