qrify-base:

  name: qrify-portal
  deployment: true
  replicaCount: 1
  ecrRegistry: "856096729725.dkr.ecr.us-east-2.amazonaws.com"

  serviceAccount:
    create: false

  image:
    pullPolicy: IfNotPresent

  rollout:
    enabled: true
    activeService: qrify-portal-active
    previewService: qrify-portal-preview
    autoPromotionEnabled: true

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000

  ingress:
    enabled: false
    className: "nginx"
    annotations: {}
    hosts: []
    tls: []

  metrics:
    enabled: true
    path: /api/metrics
    interval: 15s

  # Keys from K8s Secret `portal-github-token` (this chart's qrify-secrets dep).
  env: []
  envSecrets:
    - portal-github-token

  resources: {}

  livenessProbe: {}
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 5


qrify-secrets:
  awsRegion: us-east-2
  secretPrefix: qrify
  refreshInterval: 5m
  secrets:
    - name: portal-github-token
