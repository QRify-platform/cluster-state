qrify-base:

  name: eacds
  deployment: true
  replicaCount: 1
  ecrRegistry: "856096729725.dkr.ecr.us-east-2.amazonaws.com"

  serviceAccount:
    create: false

  image:
    pullPolicy: IfNotPresent

  rollout:
    enabled: true
    activeService: eacds-active
    previewService: eacds-preview
    autoPromotionEnabled: true

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000

  # Host ingress left off by default (add SAN / DNS when ready).
  ingress:
    enabled: false
    className: "nginx"
    annotations: {}
    hosts: []
    tls: []

  metrics:
    enabled: false

  env: []

  resources: {}

  livenessProbe: {}
  readinessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 5
