qrify-base:
  environment: dev
  imageTag: "d00edde8"
  replicaCount: 1
  labels:
    test: 'true'
    app.kubernetes.io/instance: qrify-web-api-dev
    app.kubernetes.io/name: qrify-web-api-dev
    monitoring: enabled
  podLabels:
    app.kubernetes.io/instance: qrify-web-api-dev
    app.kubernetes.io/name: qrify-web-api-dev
    monitoring: enabled
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8000"

  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::856096729725:role/QRifyWebApiS3Role-dev

  env:
    - name: PORT
      value: "8000"
    - name: S3_BUCKET_NAME
      value: "qrify-web-platform-storage-dev"
    - name: AWS_REGION
      value: "us-east-2"
    - name: AWS_DEFAULT_REGION
      value: "us-east-2"

  # Dedicated API host (TLS at ELB; CORS allows web origins).
  ingress:
    enabled: true
    className: "nginx"
    annotations: {}
    hosts:
      - host: api.dev.qrify-web.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

qrify-secrets:
  secrets:
    - name: qrify-web-api-db
      key: qrify/dev/qrify-web-api-db
    - name: qrify-web-api-cognito
      key: qrify/dev/qrify-cognito
