qrify-base:
  environment: dev
  imageTag: 6ba1d9e0
  replicaCount: 1
  labels:
    test: 'true'
    app.kubernetes.io/instance: qrify-web-api-dev
    app.kubernetes.io/name: qrify-web-api-dev
    monitoring: enabled
  podLabels:
    app.kubernetes.io/instance: qrify-web-api-dev
    app.kubernetes.io/name: qrify-web-api-dev
    monitoring: enabled
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8000"

  # Same host as /dev web; strip /backend for FastAPI (TLS at ELB).
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /$2
    hosts:
      - host: dev.qrify-web.com
        paths:
          - path: /backend(/|$)(.*)
            pathType: ImplementationSpecific
    tls: []

qrify-secrets:
  environment: dev
