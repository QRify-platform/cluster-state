qrify-base:
  environment: dev
  imageTag: c0752854
  replicaCount: 1
  labels:
    test: 'true'
    app.kubernetes.io/instance: qrify-web-api-dev
    app.kubernetes.io/name: qrify-web-api-dev
    monitoring: enabled
  podLabels:
    app.kubernetes.io/instance: qrify-web-api-dev
    app.kubernetes.io/name: qrify-web-api-dev
    monitoring: enabled
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8000"

  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::856096729725:role/QRifyWebApiS3Role-dev

  env:
    - name: PORT
      value: "8000"
    - name: S3_BUCKET_NAME
      value: "qrify-web-platform-storage-dev"
    - name: AWS_REGION
      value: "us-east-2"
    - name: AWS_DEFAULT_REGION
      value: "us-east-2"

  # Same host as /dev web; strip /backend for FastAPI (TLS at ELB).
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /$2
    hosts:
      - host: dev.qrify-web.com
        paths:
          - path: /backend(/|$)(.*)
            pathType: ImplementationSpecific
    tls: []

qrify-secrets:
  environment: dev
