qrify-base:
  environment: prod
  imageTag: 4e4896b3

  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::856096729725:role/QRifyWebApiS3Role-prod

  env:
    - name: PORT
      value: "8000"
    - name: S3_BUCKET_NAME
      value: "qrify-web-platform-storage-prod"
    - name: AWS_REGION
      value: "us-east-2"
    - name: AWS_DEFAULT_REGION
      value: "us-east-2"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  labels:
    test: "true"
    app.kubernetes.io/instance: qrify-web-api-prod
    app.kubernetes.io/name: qrify-web-api-prod
    monitoring: enabled
  podLabels:
    app.kubernetes.io/instance: qrify-web-api-prod
    app.kubernetes.io/name: qrify-web-api-prod
    monitoring: enabled
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8000"
  rollout:
    autoPromotionEnabled: false

  # Same host as web; strip /backend for FastAPI (TLS at ELB).
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /$2
    hosts:
      - host: qrify-web.com
        paths:
          - path: /backend(/|$)(.*)
            pathType: ImplementationSpecific
    tls: []

qrify-secrets:
  environment: prod
