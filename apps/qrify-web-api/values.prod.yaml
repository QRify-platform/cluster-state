qrify-base:
  environment: prod
  imageTag: 64356a65
  replicaCount: 2
  labels:
    test: "true"
    app.kubernetes.io/instance: qrify-web-api-prod
    app.kubernetes.io/name: qrify-web-api-prod
    monitoring: enabled
  podLabels:
    app.kubernetes.io/instance: qrify-web-api-prod
    app.kubernetes.io/name: qrify-web-api-prod
    monitoring: enabled
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8000"
  rollout:
    autoPromotionEnabled: false

  # Same host as web; strip /backend for FastAPI (TLS at ELB).
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /$2
    hosts:
      - host: qrify-web.com
        paths:
          - path: /backend(/|$)(.*)
            pathType: ImplementationSpecific
    tls: []

qrify-secrets:
  environment: prod

