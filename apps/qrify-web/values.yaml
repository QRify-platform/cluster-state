qrify-base:

  name: qrify-web
  deployment: true
  replicaCount: 1
  ecrRegistry: "856096729725.dkr.ecr.us-east-2.amazonaws.com"

  serviceAccount:
    create: false

  image:
    pullPolicy: IfNotPresent

  rollout:
    enabled: true
    activeService: qrify-web-active
    previewService: qrify-web-preview
    autoPromotionEnabled: true

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000

  ingress:
    enabled: false
    className: "nginx"
    annotations: {}
    hosts: []
    tls: []

  metrics:
    enabled: true
    path: /api/metrics
    interval: 15s

  env:
    # Build-time NEXT_PUBLIC_* wins in the browser; kept for consistency.
    - name: NEXT_PUBLIC_API_BASE_URL
      value: "/backend"

  resources: {}

  livenessProbe: {}
  readinessProbe:
      httpGet:
        path: /api/health
        port: 3000  
      initialDelaySeconds: 5
      periodSeconds: 5