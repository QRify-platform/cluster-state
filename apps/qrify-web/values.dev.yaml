qrify-base:
  environment: dev
  imageTag: 509ccaa4

  replicaCount: 1

  labels:
    test: "true"
    app.kubernetes.io/instance: qrify-web-dev
    app.kubernetes.io/name: qrify-web-dev
    monitoring: enabled
  podLabels:
    app.kubernetes.io/instance: qrify-web-dev
    app.kubernetes.io/name: qrify-web-dev
    monitoring: enabled
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/api/metrics"
    prometheus.io/port: "3000"

  # Host-based /dev (TLS terminates at the nginx ELB via ACM).
  ingress:
    enabled: true
    className: "nginx"
    annotations: {}
    hosts:
      - host: dev.qrify-web.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

qrify-secrets:
  environment: dev
