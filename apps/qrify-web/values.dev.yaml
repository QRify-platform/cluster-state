qrify-base:
  environment: dev
  imageTag: 7d38ebb7

  replicaCount: 1

  labels:
    test: "true"
    app.kubernetes.io/instance: qrify-web-dev
    app.kubernetes.io/name: qrify-web-dev
    monitoring: enabled
  podLabels:
    app.kubernetes.io/instance: qrify-web-dev
    app.kubernetes.io/name: qrify-web-dev
    monitoring: enabled
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/api/metrics"
    prometheus.io/port: "3000"

  # Path-based on nginx LB hostname (no custom DNS yet).
  ingress:
    enabled: true
    className: "nginx"
    annotations: {}
    hosts:
      - paths:
          - path: /
            pathType: Prefix
    tls: []
