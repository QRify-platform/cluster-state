qrify-base:
  environment: prod
  imageTag: 650959e5

  # HPA owns replica count when enabled
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  rollout:
    autoPromotionEnabled: false

  labels:
    test: "true"
    app.kubernetes.io/instance: qrify-web-prod
    app.kubernetes.io/name: qrify-web-prod
    monitoring: enabled
  podLabels:
    app.kubernetes.io/instance: qrify-web-prod
    app.kubernetes.io/name: qrify-web-prod
    monitoring: enabled
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/api/metrics"
    prometheus.io/port: "3000"

  # Prod hostname (TLS terminates at the nginx ELB via ACM).
  ingress:
    enabled: true
    className: "nginx"
    annotations: {}
    hosts:
      - host: qrify-web.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

qrify-secrets:
  environment: prod
