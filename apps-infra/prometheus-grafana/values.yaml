# Grafana admin from Secrets Manager (see qrify-secrets below).
qrify-secrets:
  environment: platform
  awsRegion: us-east-2
  secretPrefix: qrify
  refreshInterval: 5m
  secrets:
    - name: grafana-admin

kube-prometheus-stack:
  # Keep the stack light for t3.small (2Gi) free-tier nodes.
  alertmanager:
    enabled: false

  grafana:
    adminUser: admin
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    service:
      type: LoadBalancer
    ingress:
      enabled: false
    # Pick up dashboard ConfigMaps from this chart (label grafana_dashboard=1).
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL
        folderAnnotation: grafana_folder
        provider:
          foldersFromFilesStructure: false
    additionalDataSources:
      - name: Loki
        type: loki
        uid: Loki
        access: proxy
        url: http://loki-stack-platform.logging.svc.cluster.local:3100
        isDefault: false
        jsonData:
          maxLines: 1000
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

  prometheus:
    service:
      type: LoadBalancer
    ingress:
      enabled: false
    prometheusSpec:
      replicas: 1
      retention: 3d
      scrapeInterval: 60s
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
      # Select all ServiceMonitors / PodMonitors (apps + kube-state-metrics +
      # node-exporter). Previously limited to monitoring=enabled, which excluded
      # cluster metrics and left the QRify Platform dashboard empty.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      serviceMonitorNamespaceSelector: {}
      podMonitorNamespaceSelector: {}
      serviceMonitorSelector: {}
      podMonitorSelector: {}

  kube-state-metrics:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi

  prometheusOperator:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
