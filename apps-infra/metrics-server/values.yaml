# EKS: kubelet serving certs aren't trusted by metrics-server by default,
# so insecure TLS + InternalIP is the usual install.
metrics-server:
  args:
    - --cert-dir=/tmp
    - --kubelet-preferred-address-types=InternalIP
    - --kubelet-use-node-status-port
    - --metric-resolution=15s
    - --kubelet-insecure-tls

  resources:
    requests:
      cpu: 100m
      memory: 200Mi
