external-dns:
  provider:
    name: aws

  serviceAccount:
    create: true
    name: external-dns
    annotations:
      # IRSA from infra module.external_dns (QRifyExternalDNSRole)
      eks.amazonaws.com/role-arn: arn:aws:iam::856096729725:role/QRifyExternalDNSRole

  sources:
    - service
    - ingress

  # Delete Route53 records when Ingress/Service goes away (fixes TF destroy DNS pain)
  policy: sync

  domainFilters:
    - qrify-web.com

  registry: txt
  txtOwnerId: qrify-eks
  # Trailing "%{record_type}." keeps apex ownership TXT inside the zone
  # (default a-qrify-web.com would fall OUTSIDE qrify-web.com).
  txtPrefix: "edns-%{record_type}."

  env:
    - name: AWS_DEFAULT_REGION
      value: us-east-2

  extraArgs:
    - --aws-zone-type=public
